<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | کربلایی طاها زراعتکار</title><link rel="stylesheet" href="admin.css"></head><body>
<div class="wrap"><header class="adminbar"><strong>پنل مدیریت سایت</strong><div><a class="back" href="index.html">مشاهده سایت</a><button id="logout" class="btn alt hidden">خروج</button></div></header>
<section id="loginBox" class="panel login"><h1>ورود مدیر</h1><p>برای مدیریت پوسترها، مراسم‌ها، صوت‌ها و اطلاعات سایت وارد شوید.</p><input id="email" type="email" placeholder="ایمیل مدیر"><input id="password" type="password" placeholder="رمز عبور"><button id="login" class="btn">ورود</button><div id="loginMsg" class="msg"></div></section>
<main id="dashboard" class="hidden"><div class="tabs"><button data-tab="posters" class="active">پوسترها</button><button data-tab="events">مراسم‌ها</button><button data-tab="audios">صوت‌ها</button><button data-tab="settings">اطلاعات سایت</button></div>
<section id="tab-posters" class="tab panel"><h2>افزودن پوستر</h2><div class="form"><input id="posterTitle" placeholder="عنوان پوستر"><input id="posterFile" type="file" accept="image/*"><button id="addPoster" class="btn">آپلود و افزودن</button></div><div id="posterItems" class="items"></div></section>
<section id="tab-events" class="tab panel hidden"><h2>مدیریت مراسم‌ها</h2><div class="form"><input id="eventTitle" placeholder="عنوان مراسم"><input id="eventDate" type="datetime-local"><input id="eventLocation" placeholder="محل برگزاری"><textarea id="eventDescription" placeholder="توضیحات"></textarea><button id="addEvent" class="btn">ثبت مراسم</button></div><div id="eventItems" class="items"></div></section>
<section id="tab-audios" class="tab panel hidden"><h2>مدیریت صوت‌ها</h2><div class="form"><input id="audioTitle" placeholder="عنوان صوت"><input id="audioDescription" placeholder="توضیح کوتاه"><input id="audioFile" type="file" accept="audio/*"><button id="addAudio" class="btn">آپلود و افزودن صوت</button></div><div id="audioItems" class="items"></div></section>
<section id="tab-settings" class="tab panel hidden"><h2>اطلاعات سایت</h2><div class="form"><input id="siteTitleInput" placeholder="عنوان سایت"><input id="siteSubtitleInput" placeholder="زیرعنوان"><textarea id="aboutInput" placeholder="متن درباره من"></textarea><input id="telegramInput" placeholder="لینک تلگرام"><input id="instagramInput" placeholder="لینک اینستاگرام"><input id="eitaaInput" placeholder="لینک ایتا"><input id="baleInput" placeholder="لینک بله"><button id="saveSettings" class="btn">ذخیره اطلاعات سایت</button></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="admin.js"></script></body></html>
